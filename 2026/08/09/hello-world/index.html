  <script>
    (function(){
      var html = document.documentElement;
      var scheme = 'auto';
      var currentTheme = scheme !== 'auto' ? scheme : 'light';

      // Safe localStorage wrapper
      function loadTheme() {
        try {
          return localStorage.getItem('theme');
        } catch(e) {
          return null;
        }
      }
      function saveTheme(t) {
        try {
          localStorage.setItem('theme', t);
        } catch(e) {}
      }

      function applyTheme(t) {
        if (t === 'auto') {
          currentTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        } else {
          currentTheme = t;
        }
        html.setAttribute('data-theme', currentTheme);
        // Direct inline styles for guaranteed cross-browser background/text
        if (currentTheme === 'dark') {
          html.style.backgroundColor = '#1C1B1F';
          html.style.color = '#E6E1E5';
        } else {
          html.style.backgroundColor = '#FFFBFE';
          html.style.color = '#1C1B1F';
        }
      }

      // Init
      var saved = loadTheme();
      if (saved) {
        applyTheme(saved);
      } else if (scheme === 'auto') {
        applyTheme('auto');
      } else {
        applyTheme(scheme);
      }

      // System theme change listener
      try {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
          var cur = loadTheme();
          if (!cur || cur === 'auto') {
            applyTheme('auto');
          }
        });
      } catch(e) {}

      // Toggle function exposed globally — simple light/dark only
      window.toggleTheme = function() {
        var cur = html.getAttribute('data-theme');
        var next = (cur === 'dark') ? 'light' : 'dark';
        saveTheme(next);
        applyTheme(next);
      };
    })();
  </script>
